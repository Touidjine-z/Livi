name: rendez_vous_sante
description: "Rendez-Vous Santé Algérie - Une application mobile pour réserver des rendez-vous chez les médecins en Algérie."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  flutter_staggered_grid_view: ^0.7.0

  # Firebase
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.10.0
  firebase_storage: ^11.3.0

  # State Management
  provider: ^6.0.0
  get: ^4.6.5

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0 # ou ^4.2.0 pour compatibilité moderne

  # Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0

  # Email
  mailer: ^6.2.0

  # Date & Time
  intl: ^0.19.0
  timezone: ^0.9.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # Security
  flutter_secure_storage: ^9.0.0

  # Utils
  uuid: ^4.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
